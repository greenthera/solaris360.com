    <style>
      /* Match globals.css up front: the async app CSS must not move anything already
         painted (the UA 8px body margin alone scored CLS 1.0 on mobile). */
      html, body { margin: 0; background: #0f0e24; }
      /* Boot splash - shown before the app hydrates, removed by Layout. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0f0e24;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
      /* The app CSS loads non-blocking; keep the page unpainted until it applies
         (globals.css flips this) so slow connections never see - or count as layout
         shift - an unstyled render. Zero height + clip too: unstyled wide images
         would otherwise widen the mobile layout viewport and move the splash. */
      #root { visibility: hidden; height: 0; overflow: hidden; }
      #boot .boot-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 320px;
        height: 320px;
        translate: -50% -58%;
        border-radius: 50%;
        background: radial-gradient(circle, #f3a02e26, transparent 68%);
        animation: boot-glow 2.8s ease-in-out infinite;
      }
      #boot img {
        position: relative;
        width: clamp(160px, 40vw, 240px);
        height: auto;
        animation: boot-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #boot .boot-bar {
        position: relative;
        margin-top: 24px;
        width: clamp(140px, 34vw, 220px);
        height: 2px;
        border-radius: 9px;
        background: rgba(253, 253, 252, 0.12);
        overflow: hidden;
      }
      #boot .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: 9px;
        background: linear-gradient(90deg, transparent, #f3a02e, transparent);
        animation: boot-bar 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: none; } }
      @keyframes boot-glow { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes boot-bar { from { transform: translateX(-120%); } to { transform: translateX(360%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot img, #boot .boot-glow, #boot .boot-bar::after { animation: none; }
        #boot .boot-bar::after { width: 100%; }
      }
    </style>

    <script>
      try {
        if (sessionStorage.getItem('sol_boot') === '1')
          document.getElementById('boot').classList.add('done')
      } catch (e) {}
      /* failsafe: never trap the viewer on the splash if the app fails to load */
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r) r.style.visibility = 'visible'
        var b = document.getElementById('boot')
        if (b && !b.classList.contains('done')) {
          b.classList.add('done')
          setTimeout(function () {
            if (b) b.remove()
          }, 600)
        }
      }, 10000)
    </script>
